name: Section 25 Process Mapping and Control Intelligence
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  section-25-quality:
    name: PHP ${{ matrix.php }} cumulative quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, fileinfo, simplexml, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cumulative Sections 1-25 gates
        id: quality
        continue-on-error: true
        run: tests/run-quality.sh > /tmp/section25-quality.log 2>&1
      - name: Publish failed quality output
        if: steps.quality.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: section25-quality-php-${{ matrix.php }}
          path: /tmp/section25-quality.log
          if-no-files-found: error
      - name: Fail unsuccessful quality gate
        if: steps.quality.outcome == 'failure'
        run: tail -n 500 /tmp/section25-quality.log && exit 1
      - name: Print successful quality output
        if: steps.quality.outcome == 'success'
        run: cat /tmp/section25-quality.log
  mysql-8-section-25:
    name: MySQL 8 cumulative migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: gruber_test}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Import cumulative schema and Section 25 twice
        run: |
          for file in database/gruber_ai_procurement_single_install_v3.sql database/20260726_section11_supplier_comparison.sql database/20260726_section12_procurement_scenarios.sql database/20260726_section13_mitigation_action_plans.sql database/20260726_section14_execution_recovery_verification.sql database/20260726_section15_supplier_performance_improvement.sql database/20260726_section16_contract_lifecycle_renewal_governance.sql database/20260727_section17_demand_requisition_budget_governance.sql database/20260727_section18_fulfillment_receiving_invoice_match.sql database/20260727_section19_inventory_operations_replenishment_governance.sql database/20260727_section20_savings_realization_finance_governance.sql database/20260727_section21_enterprise_spend_category_strategy_planning.sql database/20260727_section22_supplier_portal_collaboration_exchange.sql database/20260727_section23_accounts_payable_payment_close_governance.sql database/20260727_section24_business_entity_integration_foundation.sql database/20260727_section25_process_mapping_orchestration_control_intelligence.sql database/20260727_section25_process_mapping_orchestration_control_intelligence.sql; do mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < "$file"; done
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.schema_migrations WHERE version IN ('4.0-section11','4.1-section12','4.2-section13','4.3-section14','4.4-section15','4.5-section16','4.6-section17','4.7-section18','4.8-section19','4.9-section20','5.0-section21','5.1-section22','5.2-section23','5.3-section24','5.4-section25')" | grep -qx '15'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gruber_test' AND table_name IN ('business_processes','business_process_versions','business_process_lanes','business_process_steps','business_process_transitions','business_process_controls','business_process_integrations','business_process_assignments','business_process_instances','business_process_step_instances','business_process_exceptions','business_process_events')" | grep -qx '12'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_processes WHERE is_template=1" | grep -qx '1'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_process_steps s JOIN gruber_test.business_process_versions v ON v.id=s.version_id JOIN gruber_test.business_processes p ON p.id=v.process_id WHERE p.template_code='procure_to_pay'" | grep -qx '14'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_process_transitions WHERE version_id=(SELECT active_version_id FROM gruber_test.business_processes WHERE process_code='PROC-P2P')" | grep -qx '14'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_process_controls c JOIN gruber_test.business_process_steps s ON s.id=c.step_id WHERE s.version_id=(SELECT active_version_id FROM gruber_test.business_processes WHERE process_code='PROC-P2P')" | grep -qx '12'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_process_integrations i JOIN gruber_test.business_process_steps s ON s.id=i.step_id WHERE s.version_id=(SELECT active_version_id FROM gruber_test.business_processes WHERE process_code='PROC-P2P')" | grep -qx '7'
