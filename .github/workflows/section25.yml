          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.schema_migrations WHERE version IN ('4.0-section11','4.1-section12','4.2-section13','4.3-section14','4.4-section15','4.5-section16','4.6-section17','4.7-section18','4.8-section19','4.9-section20','5.0-section21','5.1-section22','5.2-section23','5.3-section24','5.4-section25')" | grep -qx '15'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gruber_test' AND table_name IN ('business_processes','business_process_versions','business_process_lanes','business_process_steps','business_process_transitions','business_process_controls','business_process_integrations','business_process_assignments','business_process_instances','business_process_step_instances','business_process_exceptions','business_process_events')" | grep -qx '12'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_processes WHERE is_template=1" | grep -qx '1'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_process_steps s JOIN gruber_test.business_process_versions v ON v.id=s.version_id JOIN gruber_test.business_processes p ON p.id=v.process_id WHERE p.template_code='procure_to_pay'" | grep -qx '14'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_process_transitions WHERE version_id=(SELECT active_version_id FROM gruber_test.business_processes WHERE process_code='PROC-P2P')" | grep -qx '14'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_process_controls c JOIN gruber_test.business_process_steps s ON s.id=c.step_id WHERE s.version_id=(SELECT active_version_id FROM gruber_test.business_processes WHERE process_code='PROC-P2P')" | grep -qx '12'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.business_process_integrations i JOIN gruber_test.business_process_steps s ON s.id=i.step_id WHERE s.version_id=(SELECT active_version_id FROM gruber_test.business_processes WHERE process_code='PROC-P2P')" | grep -qx '7'
