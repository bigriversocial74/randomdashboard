name: Section 19 Inventory Operations and Replenishment Governance

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  section-19-quality:
    name: PHP ${{ matrix.php }} cumulative quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, fileinfo, simplexml, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cumulative Sections 1-19 gates
        id: quality
        continue-on-error: true
        run: tests/run-quality.sh > /tmp/section19-quality.log 2>&1
      - name: Publish failed quality output
        if: steps.quality.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: section19-quality-php-${{ matrix.php }}
          path: /tmp/section19-quality.log
          if-no-files-found: error
      - name: Fail unsuccessful quality gate
        if: steps.quality.outcome == 'failure'
        run: |
          tail -n 180 /tmp/section19-quality.log
          exit 1
      - name: Print successful quality output
        if: steps.quality.outcome == 'success'
        run: cat /tmp/section19-quality.log

  mysql-8-section-19:
    name: MySQL 8 cumulative migrations
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gruber_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Import cumulative schema and Section 19 twice
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/gruber_ai_procurement_single_install_v3.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section11_supplier_comparison.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section12_procurement_scenarios.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section13_mitigation_action_plans.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section14_execution_recovery_verification.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section15_supplier_performance_improvement.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section16_contract_lifecycle_renewal_governance.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260727_section17_demand_requisition_budget_governance.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260727_section18_fulfillment_receiving_invoice_match.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260727_section19_inventory_operations_replenishment_governance.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260727_section19_inventory_operations_replenishment_governance.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.schema_migrations WHERE version IN ('4.0-section11','4.1-section12','4.2-section13','4.3-section14','4.4-section15','4.5-section16','4.6-section17','4.7-section18','4.8-section19')" | grep -qx '9'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gruber_test' AND table_name IN ('inventory_replenishment_policies','inventory_replenishment_recommendations','inventory_reservations','inventory_transfer_requests','inventory_transfer_lines','inventory_transfer_events','inventory_governance_events')" | grep -qx '7'

  mariadb-section-19:
    name: MariaDB 10.11 cumulative migrations
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gruber_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - name: Install database client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Import cumulative schema and Section 19 twice
        run: |
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/gruber_ai_procurement_single_install_v3.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section11_supplier_comparison.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section12_procurement_scenarios.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section13_mitigation_action_plans.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section14_execution_recovery_verification.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section15_supplier_performance_improvement.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260726_section16_contract_lifecycle_renewal_governance.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260727_section17_demand_requisition_budget_governance.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260727_section18_fulfillment_receiving_invoice_match.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260727_section19_inventory_operations_replenishment_governance.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < database/20260727_section19_inventory_operations_replenishment_governance.sql
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.schema_migrations WHERE version IN ('4.0-section11','4.1-section12','4.2-section13','4.3-section14','4.4-section15','4.5-section16','4.6-section17','4.7-section18','4.8-section19')" | grep -qx '9'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gruber_test' AND table_name IN ('inventory_replenishment_policies','inventory_replenishment_recommendations','inventory_reservations','inventory_transfer_requests','inventory_transfer_lines','inventory_transfer_events','inventory_governance_events')" | grep -qx '7'
