name: Bootstrap Phase 2 source

on:
  push:
    branches:
      - phase-2-production-data-integration
    paths:
      - '.bootstrap/READY'
      - '.github/workflows/bootstrap-phase2-source.yml'

permissions:
  contents: write

jobs:
  unpack-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and unpack source archive
        shell: bash
        run: |
          set -euo pipefail
          test -f .bootstrap/READY
          chunk_count="$(find .bootstrap -maxdepth 1 -type f -name 'chunk_*' | wc -l)"
          test "$chunk_count" -ge 1
          cat $(find .bootstrap -maxdepth 1 -type f -name 'chunk_*' | sort) | base64 --decode > /tmp/phase2-source.tar.xz
          test -s /tmp/phase2-source.tar.xz
          echo "Archive bytes: $(wc -c < /tmp/phase2-source.tar.xz)"
          echo "Archive SHA-256: $(sha256sum /tmp/phase2-source.tar.xz | cut -d' ' -f1)"
          xz --test /tmp/phase2-source.tar.xz
          tar -tJf /tmp/phase2-source.tar.xz > /tmp/phase2-source-files.txt
          test -s /tmp/phase2-source-files.txt
          mkdir -p /tmp/phase2-source
          tar -xJf /tmp/phase2-source.tar.xz -C /tmp/phase2-source
          test -f /tmp/phase2-source/README.md
          test -d /tmp/phase2-source/app
          test -d /tmp/phase2-source/database

      - name: Replace bootstrap files with source tree
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .bootstrap -exec rm -rf {} +
          cp -a /tmp/phase2-source/. .
          rm -rf .bootstrap
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source changes were produced.'; exit 1; }
          git commit -m 'Add complete Phase 2 production data integration baseline'
          git push origin "HEAD:${GITHUB_REF_NAME}"
