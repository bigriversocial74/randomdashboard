name: Recover complete Phase 2 source

on:
  push:
    branches:
      - phase-2-complete-source-repair
    paths:
      - '.github/workflows/bootstrap-phase2-source.yml'

permissions:
  contents: write

jobs:
  recover-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repair branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct, validate, and install source
        shell: bash
        run: |
          set -uo pipefail

          mapfile -t chunks < <(find .bootstrap -maxdepth 1 -type f -name 'chunk_*' | sort)
          chunk_count="${#chunks[@]}"
          encoded_bytes=0
          for chunk in "${chunks[@]}"; do
            encoded_bytes=$((encoded_bytes + $(wc -c < "$chunk")))
          done

          decode_status=1
          xz_status=1
          archive_bytes=0
          archive_sha='not-created'

          if [ "$chunk_count" -gt 0 ]; then
            cat "${chunks[@]}" | base64 --decode > /tmp/phase2-source.tar.xz
            decode_status=$?
          fi

          if [ -f /tmp/phase2-source.tar.xz ]; then
            archive_bytes="$(wc -c < /tmp/phase2-source.tar.xz)"
            archive_sha="$(sha256sum /tmp/phase2-source.tar.xz | cut -d' ' -f1)"
            xz --test /tmp/phase2-source.tar.xz
            xz_status=$?
          fi

          if [ "$decode_status" -eq 0 ] && [ "$xz_status" -eq 0 ]; then
            rm -rf /tmp/phase2-source
            mkdir -p /tmp/phase2-source
            tar -xJf /tmp/phase2-source.tar.xz -C /tmp/phase2-source

            source_root=''
            if [ -f /tmp/phase2-source/app/index.php ] && [ -d /tmp/phase2-source/database ]; then
              source_root='/tmp/phase2-source'
            else
              while IFS= read -r candidate; do
                if [ -f "$candidate/app/index.php" ] && [ -d "$candidate/database" ]; then
                  source_root="$candidate"
                  break
                fi
              done < <(find /tmp/phase2-source -mindepth 1 -maxdepth 3 -type d | sort)
            fi

            if [ -n "$source_root" ]; then
              find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
              cp -a "$source_root"/. .
              test -f app/index.php
              test -d database

              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git add -A
              git commit -m 'Add complete Phase 2 production source baseline'
              git push origin "HEAD:${GITHUB_REF_NAME}"
              exit 0
            fi
          fi

          cat > BOOTSTRAP_DIAGNOSTIC.txt <<EOF
          Phase 2 source archive diagnostic
          chunk_count=$chunk_count
          encoded_bytes=$encoded_bytes
          decode_status=$decode_status
          archive_bytes=$archive_bytes
          archive_sha256=$archive_sha
          xz_status=$xz_status
          expected_local_archive_bytes=186928
          expected_local_archive_sha256=812abd67628146b63b71b7ad443365622b69be32b590ccc3fd40b8a960405877
          result=stored archive is incomplete, corrupt, or lacks the expected source root
          EOF

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add BOOTSTRAP_DIAGNOSTIC.txt
          git commit -m 'Record Phase 2 bootstrap archive diagnostic'
          git push origin "HEAD:${GITHUB_REF_NAME}"
