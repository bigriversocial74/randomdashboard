name: Import quality-complete source baseline

on:
  push:
    branches:
      - quality-section-1-foundation
    paths:
      - gruber-ai-procurement-quality-complete.zip
      - .github/workflows/import-section-1-source.yml
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - gruber-ai-procurement-quality-complete.zip
      - .github/workflows/import-section-1-source.yml
  workflow_dispatch:

permissions:
  contents: write

env:
  TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ env.TARGET_BRANCH }}

      - name: Verify and extract source package
        shell: bash
        run: |
          set -euo pipefail
          package='gruber-ai-procurement-quality-complete.zip'
          source_dir='/tmp/gruber-quality-complete'
          test -f "$package"
          echo '2602114c6eff5ab27369254a97980ee10be7f4ec24d0f08d8c76d88fb577a43b  gruber-ai-procurement-quality-complete.zip' | sha256sum --check --strict
          rm -rf "$source_dir"
          mkdir -p "$source_dir"
          unzip -q "$package" -d "$source_dir"
          test -f "$source_dir/app/index.php"
          test -f "$source_dir/app/change-password.php"
          test -f "$source_dir/.github/workflows/quality.yml"
          test -f "$source_dir/docs/SECTION_10_QUALITY_REPORT.md"
          test -f "$source_dir/docs/QUALITY_SCORECARD.md"
          test -f "$source_dir/docs/SQL_CHANGE_LEDGER.md"
          test ! -f "$source_dir/config.php"
          file_count="$(find "$source_dir" -type f | wc -l)"
          test "$file_count" -ge 140

      - name: Run source quality gate
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/gruber-quality-complete
          tests/run-quality.sh

      - name: Replace importer with complete source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a /tmp/gruber-quality-complete/. .
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add quality-complete Gruber procurement source baseline'
          git push origin "HEAD:${TARGET_BRANCH}"
