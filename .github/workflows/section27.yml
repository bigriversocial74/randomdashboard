name: Section 27 Operational Calendar and Capacity
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  section-27-quality:
    name: PHP ${{ matrix.php }} cumulative quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1','8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_mysql, mbstring, openssl, fileinfo, simplexml, zip
          coverage: none
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run cumulative Sections 1-27 gates
        id: quality
        continue-on-error: true
        run: tests/run-quality.sh > /tmp/section27-quality.log 2>&1
      - name: Publish failed quality output
        if: steps.quality.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: section27-quality-php-${{ matrix.php }}
          path: /tmp/section27-quality.log
          if-no-files-found: error
      - name: Fail unsuccessful quality gate
        if: steps.quality.outcome == 'failure'
        run: tail -n 900 /tmp/section27-quality.log && exit 1
      - name: Print successful quality output
        if: steps.quality.outcome == 'success'
        run: cat /tmp/section27-quality.log

  mysql-8-section-27:
    name: MySQL 8 cumulative and repeat-safe migration
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: gruber_test}
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Import cumulative schema and Section 27 twice
        id: database
        continue-on-error: true
        run: |
          exec > >(tee /tmp/section27-mysql.log) 2>&1
          set -euo pipefail
          files=(
            database/gruber_ai_procurement_single_install_v3.sql
            database/20260726_section11_supplier_comparison.sql
            database/20260726_section12_procurement_scenarios.sql
            database/20260726_section13_mitigation_action_plans.sql
            database/20260726_section14_execution_recovery_verification.sql
            database/20260726_section15_supplier_performance_improvement.sql
            database/20260726_section16_contract_lifecycle_renewal_governance.sql
            database/20260727_section17_demand_requisition_budget_governance.sql
            database/20260727_section18_fulfillment_receiving_invoice_match.sql
            database/20260727_section19_inventory_operations_replenishment_governance.sql
            database/20260727_section20_savings_realization_finance_governance.sql
            database/20260727_section21_enterprise_spend_category_strategy_planning.sql
            database/20260727_section22_supplier_portal_collaboration_exchange.sql
            database/20260727_section23_accounts_payable_payment_close_governance.sql
            database/20260727_section24_business_entity_integration_foundation.sql
            database/20260727_section25_process_mapping_orchestration_control_intelligence.sql
            database/20260727_section26_enterprise_work_management_command_center.sql
            database/20260727_section27_operational_calendar_notifications_capacity.sql
            database/20260727_section27_operational_calendar_notifications_capacity.sql
          )
          for file in "${files[@]}"; do echo "Importing $file"; mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < "$file"; done
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gruber_test' AND table_name IN ('enterprise_calendar_events','enterprise_notification_preferences','enterprise_notification_queue','enterprise_capacity_profiles','enterprise_delegations','enterprise_digest_runs','enterprise_calendar_subscriptions','enterprise_operating_cadences')" | grep -qx '8'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.permissions WHERE permission_key LIKE 'operational_calendar.%'" | grep -qx '8'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.enterprise_operating_cadences" | grep -qx '3'
          test "$(mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.enterprise_calendar_events")" -gt 0
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.enterprise_calendar_subscriptions WHERE token_hash=token_prefix" | grep -qx '0'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.schema_migrations WHERE version='5.6-section27'" | grep -qx '1'
      - name: Upload failed MySQL output
        if: steps.database.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: section27-mysql-8-failure
          path: /tmp/section27-mysql.log
          if-no-files-found: error
      - name: Fail unsuccessful MySQL gate
        if: steps.database.outcome == 'failure'
        run: tail -n 500 /tmp/section27-mysql.log && exit 1

  mariadb-section-27:
    name: MariaDB 10.11 cumulative and repeat-safe migration
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:10.11
        env: {MYSQL_ROOT_PASSWORD: root, MYSQL_DATABASE: gruber_test}
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s --health-timeout=5s --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y default-mysql-client
      - name: Import cumulative schema and Section 27 twice
        id: database
        continue-on-error: true
        run: |
          exec > >(tee /tmp/section27-mariadb.log) 2>&1
          set -euo pipefail
          files=(
            database/gruber_ai_procurement_single_install_v3.sql
            database/20260726_section11_supplier_comparison.sql
            database/20260726_section12_procurement_scenarios.sql
            database/20260726_section13_mitigation_action_plans.sql
            database/20260726_section14_execution_recovery_verification.sql
            database/20260726_section15_supplier_performance_improvement.sql
            database/20260726_section16_contract_lifecycle_renewal_governance.sql
            database/20260727_section17_demand_requisition_budget_governance.sql
            database/20260727_section18_fulfillment_receiving_invoice_match.sql
            database/20260727_section19_inventory_operations_replenishment_governance.sql
            database/20260727_section20_savings_realization_finance_governance.sql
            database/20260727_section21_enterprise_spend_category_strategy_planning.sql
            database/20260727_section22_supplier_portal_collaboration_exchange.sql
            database/20260727_section23_accounts_payable_payment_close_governance.sql
            database/20260727_section24_business_entity_integration_foundation.sql
            database/20260727_section25_process_mapping_orchestration_control_intelligence.sql
            database/20260727_section26_enterprise_work_management_command_center.sql
            database/20260727_section27_operational_calendar_notifications_capacity.sql
            database/20260727_section27_operational_calendar_notifications_capacity.sql
          )
          for file in "${files[@]}"; do echo "Importing $file"; mysql --protocol=tcp -h 127.0.0.1 -uroot -proot gruber_test < "$file"; done
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM information_schema.tables WHERE table_schema='gruber_test' AND table_name IN ('enterprise_calendar_events','enterprise_notification_preferences','enterprise_notification_queue','enterprise_capacity_profiles','enterprise_delegations','enterprise_digest_runs','enterprise_calendar_subscriptions','enterprise_operating_cadences')" | grep -qx '8'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.permissions WHERE permission_key LIKE 'operational_calendar.%'" | grep -qx '8'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.enterprise_operating_cadences" | grep -qx '3'
          test "$(mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.enterprise_calendar_events")" -gt 0
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.enterprise_calendar_subscriptions WHERE token_hash=token_prefix" | grep -qx '0'
          mysql --protocol=tcp -h 127.0.0.1 -uroot -proot -Nse "SELECT COUNT(*) FROM gruber_test.schema_migrations WHERE version='5.6-section27'" | grep -qx '1'
      - name: Upload failed MariaDB output
        if: steps.database.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: section27-mariadb-10-11-failure
          path: /tmp/section27-mariadb.log
          if-no-files-found: error
      - name: Fail unsuccessful MariaDB gate
        if: steps.database.outcome == 'failure'
        run: tail -n 500 /tmp/section27-mariadb.log && exit 1
